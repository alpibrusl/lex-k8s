# The validating webhook registration.
#
# `failurePolicy: Fail` is not a tuning knob. With `Ignore`, a webhook
# outage means every pod is admitted unchecked — which is not a wall, it
# is a wall-shaped thing that opens under load. The consequence is real
# and belongs in your runbook: if this webhook is down, admissions stop.
#
# HONEST CAUTION: anyone with cluster-admin can delete this object. The
# audit chain records that they did; it does not stop them. The comparison
# to Gatekeeper is winnable on narrowing, not on tamper-resistance.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: lex-k8s
webhooks:
  - name: pods.lex.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    # Opt IN, by label, rather than gating everything except a
    # hand-maintained exclusion list.
    #
    # The exclusion form is the obvious one and it is how you wedge a
    # cluster you actually use. `failurePolicy: Fail` means a wall that
    # is down stops *all* scheduling, so "gate everything except the
    # three namespaces I thought of" is a bet that the list is complete —
    # and on a real cluster it never is. A CNI, a CSI driver,
    # cert-manager, the monitoring stack: each is a namespace that must
    # keep scheduling for the cluster to recover, and each one you forget
    # is discovered during an outage.
    #
    # Labelling a namespace in is reversible under pressure. Labelling
    # one out, while nothing schedules and the webhook that would let you
    # fix it cannot start, is not.
    #
    #   kubectl label ns payments lex.dev/gated=true      # gate it
    #   kubectl label ns payments lex.dev/gated-          # stop
    namespaceSelector:
      matchLabels:
        lex.dev/gated: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
    clientConfig:
      service:
        name: lex-k8s
        namespace: lex-system
        path: /admit
        port: 443
      # caBundle: <injected by cert-manager, or `kubectl` after you mint one>
  - name: lexmanifests.lex.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    rules:
      - apiGroups: ["lex.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["lexmanifests"]
    clientConfig:
      service:
        name: lex-k8s
        namespace: lex-system
        path: /narrow
        port: 443
      # caBundle: <injected by cert-manager, or `kubectl` after you mint one>
